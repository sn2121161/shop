name: Test and deploy shop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  # PRs have no production environment or deployment credentials.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build images and run backend tests
        run: bash deploy/build-and-test.sh

  # Test on GitHub; transfer source only and build release images on the server.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Build images and run backend tests
        run: bash deploy/build-and-test.sh
      - name: Pack source at the tested commit and record checksums
        run: |
          set -euo pipefail
          mkdir -p bundle
          git archive --format=tar "$GITHUB_SHA" | gzip -1 > bundle/source.tar.gz
          cp deploy/compose.yml deploy/deploy.sh deploy/build-on-server.sh deploy/unpack-source.py bundle/
          (cd bundle && sha256sum source.tar.gz compose.yml deploy.sh build-on-server.sh unpack-source.py > SHA256SUMS)
          du -h bundle/source.tar.gz
      - name: Upload source over SSH and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/srv/shop' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Set DEPLOY_USER secret}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY secret}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS secret}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/shop_deploy"
          chmod 600 "$HOME/.ssh/shop_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh_options=(-i "$HOME/.ssh/shop_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          release="$DEPLOY_PATH/releases/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'rm -f "$HOME/.ssh/shop_deploy"' EXIT
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$target" \
            "command -v rsync >/dev/null && command -v sha256sum >/dev/null && command -v python3 >/dev/null && mkdir -p '$release' && chmod 700 '$release'"
          # Preserve partial bytes and resume using rsync's delta transfer.
          transport="ssh -i $HOME/.ssh/shop_deploy -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=3"
          uploaded=false
          for attempt in 1 2 3; do
            echo "SSH upload attempt $attempt/3"
            if timeout --signal=TERM --kill-after=15s 10m \
              rsync -rt --partial --inplace --timeout=120 --info=progress2 \
              -e "$transport" bundle/ "$target:$release/"; then
              uploaded=true
              break
            fi
            if [[ "$attempt" != 3 ]]; then sleep 10; fi
          done
          [[ "$uploaded" == true ]] || { echo 'SSH upload failed; running services were not replaced.' >&2; exit 1; }
          ssh "${ssh_options[@]}" -p "$DEPLOY_PORT" "$target" \
            "cd '$release' && sha256sum --check SHA256SUMS && bash ./deploy.sh '$DEPLOY_PATH' shop-release '$GITHUB_SHA'"
